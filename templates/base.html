<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <title>M8 | ShopFlow</title>
  </head>

  <body class="bg-[#111111] text-white font-semibold">
    <main class="min-h-screen w-full flex">
      <!-- Mobile Overlay -->
      <div
        id="overlay"
        class="fixed inset-0 z-40 hidden bg-black/60 md:hidden"
      ></div>

      <!-- Sidebar -->
      <aside
        id="sideBar"
        class="fixed left-0 top-0 z-50 flex h-screen w-64 flex-col border-r border-[#333333] bg-[#1C1C1C] p-5 transition-all duration-300 -translate-x-full md:translate-x-0"
      >
        <!-- Logo -->
        <div class="flex items-center justify-between">
          <h1 id="logo" class="text-3xl font-bold tracking-wide">
            M<span class="text-[#D4A853]">8</span>
          </h1>

          <button
            id="closeSidebar"
            class="text-2xl text-gray-400 hover:text-[#D4A853] md:hidden"
            aria-label="Close sidebar"
          >
            <i class="fa fa-times"></i>
          </button>
        </div>

        <!-- Divider -->
        <hr class="my-7 border-[#333333]" />

        <nav class="flex flex-col gap-2">
          <p
            class="mb-2 px-3 text-xs font-semibold uppercase tracking-widest text-gray-500"
          >
            Main Menu
          </p>

          <a
            href="{{ url_for('dashboard') }}"
            class="nav-link flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm font-medium transition-colors {{ 'bg-[#302A20] text-[#D4A853]' if request.endpoint == 'dashboard' else 'text-gray-300 hover:bg-[#292929] hover:text-[#D4A853]' }}"
          >
            <i class="fa fa-dashboard w-5 text-lg"></i>
            <span>Dashboard</span>
          </a>

          <a
            href="{{ url_for('products') }}"
            class="nav-link flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm font-medium transition-colors {{ 'bg-[#302A20] text-[#D4A853]' if request.endpoint == 'products' else 'text-gray-300 hover:bg-[#292929] hover:text-[#D4A853]' }}"
          >
            <i class="fa fa-cubes w-5 text-lg"></i>
            <span>Products</span>
          </a>

          <a
            href="{{ url_for('sales') }}"
            class="nav-link flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm font-medium transition-colors {{ 'bg-[#302A20] text-[#D4A853]' if request.endpoint == 'sales' else 'text-gray-300 hover:bg-[#292929] hover:text-[#D4A853]' }}"
          >
            <i class="fa fa-shopping-cart w-5 text-lg"></i>
            <span>New Sale</span>
          </a>

          <a
            href="{{ url_for('history') }}"
            class="nav-link flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm font-medium transition-colors {{ 'bg-[#302A20] text-[#D4A853]' if request.endpoint == 'history' else 'text-gray-300 hover:bg-[#292929] hover:text-[#D4A853]' }}"
          >
            <i class="fa fa-history w-5 text-lg"></i>
            <span>Sales History</span>
          </a>
        </nav>

        <!-- Bottom Section -->
        <div class="mt-auto">
          <hr class="mb-4 border-[#333333]" />

          <button
            id="toggleSidebar"
            class="hidden w-full items-center justify-center gap-3 rounded-lg px-3 py-3 text-gray-400 transition-colors hover:bg-[#292929] hover:text-[#D4A853] md:flex"
            aria-label="Collapse sidebar"
          >
            << Collapse Menu
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <section
        id="mainContent"
        class="min-h-screen w-full min-w-0 p-4 pt-20 transition-all duration-300 md:ml-64 md:p-8"
      >
        <!-- Mobile Header -->
        <header
          class="fixed left-0 top-0 z-30 flex w-full items-center justify-between border-b border-[#333333] bg-[#1C1C1C] p-4 md:hidden"
        >
          <h2 class="text-xl font-bold">
            Shop<span class="text-[#D4A853]">Flow</span>
          </h2>

          <button
            id="openSidebar"
            class="text-2xl text-white hover:text-[#D4A853]"
            aria-label="Open sidebar"
          >
            <i class="fa fa-bars"></i>
          </button>
        </header>
        {% block main %} {% endblock %}
      </section>
    </main>
    <script>
      const sidebar = document.querySelector("#sideBar");
      const collapseBtn = document.querySelector("#toggleSidebar");
      const mainContent = document.querySelector("#mainContent");

      const openBtn = document.querySelector("#openSidebar");
      const closeBtn = document.querySelector("#closeSidebar");
      const overlay = document.querySelector("#overlay");

      const logo = document.querySelector("#logo");

      const navLinks = sidebar.querySelectorAll("nav a");
      const navTexts = sidebar.querySelectorAll("nav a span");
      const navHeading = sidebar.querySelector("nav > p");

      // Desktop: Collapse and expand sidebar
      collapseBtn.addEventListener("click", () => {
        const isCollapsed = !sidebar.classList.contains("sidebar-collapsed");

        sidebar.classList.toggle("sidebar-collapsed", isCollapsed);
        sidebar.classList.toggle("w-64", !isCollapsed);
        sidebar.classList.toggle("w-20", isCollapsed);

        mainContent.classList.toggle("md:ml-64", !isCollapsed);
        mainContent.classList.toggle("md:ml-20", isCollapsed);

        logo.classList.toggle("text-center", isCollapsed);

        navTexts.forEach((text) => {
          text.classList.toggle("hidden", isCollapsed);
        });

        navLinks.forEach((link) => {
          link.classList.toggle("justify-center", isCollapsed);
          link.classList.toggle("px-3", !isCollapsed);
          link.classList.toggle("px-0", isCollapsed);
        });

        navHeading.classList.toggle("hidden", isCollapsed);

        collapseBtn.textContent = isCollapsed ? ">>" : "<< Collapse Menu";

        collapseBtn.setAttribute(
          "aria-label",
          isCollapsed ? "Expand sidebar" : "Collapse sidebar",
        );
      });

      // Mobile: Open sidebar
      function openSidebar() {
        sidebar.classList.remove("-translate-x-full");
        sidebar.classList.add("translate-x-0");

        overlay.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
      }

      // Mobile: Close sidebar
      function closeSidebar() {
        sidebar.classList.add("-translate-x-full");
        sidebar.classList.remove("translate-x-0");

        overlay.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
      }

      openBtn.addEventListener("click", openSidebar);
      closeBtn.addEventListener("click", closeSidebar);
      overlay.addEventListener("click", closeSidebar);
    </script>
  </body>
</html>
